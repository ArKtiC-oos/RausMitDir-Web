<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LumaEdit">
<link rel="manifest" href="manifest.webmanifest">
<title>LumaEdit 0.2</title>
<style>
:root{--bg:#070b12;--panel:#0f1726;--panel2:#162237;--line:#273752;--txt:#f6f8fc;--muted:#93a4bc;--acc:#7b8cff;--ok:#4bd9a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100%}body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom))}
.app{max-width:820px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.brand{font-size:22px;font-weight:900}.sub{font-size:11px;color:var(--muted)}.actions{display:flex;gap:6px}
.btn{min-height:42px;border:1px solid var(--line);background:var(--panel2);color:white;border-radius:12px;padding:9px 12px;font-weight:800}.btn.primary{background:linear-gradient(135deg,#7b8cff,#5f70e8);border:0}.btn:disabled{opacity:.35}.iconbtn{width:42px;padding:0;font-size:18px}
.stage{position:relative;background:#03060b;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:300px;display:grid;place-items:center}.stage canvas{display:block;max-width:100%;max-height:58vh;touch-action:none}.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty b{display:block;color:white;font-size:18px;margin-bottom:6px}
.tabs{display:flex;gap:7px;overflow:auto;padding:9px 1px 5px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#dce5f1;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:800}.tab.active{outline:2px solid var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:11px;margin-top:6px}.row{display:grid;grid-template-columns:92px 1fr 48px;gap:9px;align-items:center;margin:7px 0}.row label{font-size:12px}.row output{font-size:11px;text-align:right;color:var(--muted)}input[type=range]{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.filter{min-width:90px;border:1px solid var(--line);background:var(--panel2);color:white;border-radius:12px;padding:10px 8px;font-size:12px;font-weight:800}.filter.active{outline:2px solid var(--acc)}.mini{font-size:11px;color:var(--muted);margin-top:7px}.bottom{display:flex;gap:8px;margin-top:9px}.bottom>*{flex:1}.quality{width:100%;min-height:42px;border-radius:11px;background:var(--panel2);color:white;border:1px solid var(--line);padding:0 10px}
.badge{display:inline-block;font-size:10px;color:#0a1520;background:var(--ok);border-radius:999px;padding:3px 7px;font-weight:900;margin-left:6px}
</style>
</head>
<body><div class="app">
<div class="top">
  <div><div class="brand">LumaEdit <span class="badge">0.2</span></div><div class="sub">Mobile Photo Editor</div></div>
  <div class="actions"><button class="btn iconbtn" id="undo" disabled>↶</button><button class="btn iconbtn" id="redo" disabled>↷</button><button class="btn" id="open">Foto</button></div>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div class="stage" id="stage"><div class="empty" id="empty"><b>Foto auswählen</b>Danach kannst du direkt bearbeiten.</div><canvas id="cv" hidden></canvas></div>

<div class="tabs">
<button class="tab active" data-tab="light">Licht</button>
<button class="tab" data-tab="color">Farbe</button>
<button class="tab" data-tab="detail">Details</button>
<button class="tab" data-tab="filter">Filter</button>
<button class="tab" data-tab="crop">Crop</button>
<button class="tab" data-tab="export">Export</button>
</div>

<div class="panel" id="light">
<div class="row"><label>Belichtung</label><input data-k="exposure" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Helligkeit</label><input data-k="brightness" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Kontrast</label><input data-k="contrast" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Highlights</label><input data-k="highlights" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Schatten</label><input data-k="shadows" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Weiß</label><input data-k="whites" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Schwarz</label><input data-k="blacks" type="range" min="-100" max="100" value="0"><output>0</output></div>
</div>

<div class="panel" id="color" hidden>
<div class="row"><label>Sättigung</label><input data-k="saturate" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Dynamik</label><input data-k="vibrance" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Temperatur</label><input data-k="warmth" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Farbton</label><input data-k="tint" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Fade</label><input data-k="fade" type="range" min="0" max="100" value="0"><output>0</output></div>
</div>

<div class="panel" id="detail" hidden>
<div class="row"><label>Klarheit</label><input data-k="clarity" type="range" min="-100" max="100" value="0"><output>0</output></div>
<div class="row"><label>Schärfe</label><input data-k="sharpness" type="range" min="0" max="100" value="0"><output>0</output></div>
<div class="row"><label>Körnung</label><input data-k="grain" type="range" min="0" max="100" value="0"><output>0</output></div>
<div class="row"><label>Vignette</label><input data-k="vignette" type="range" min="0" max="100" value="0"><output>0</output></div>
</div>

<div class="panel" id="filter" hidden>
<div class="filters">
<button class="filter active" data-f="none">Original</button>
<button class="filter" data-f="vivid">Vivid</button>
<button class="filter" data-f="portrait">Portrait</button>
<button class="filter" data-f="warm">Warm</button>
<button class="filter" data-f="cool">Cool</button>
<button class="filter" data-f="mono">Mono</button>
<button class="filter" data-f="film">Film</button>
<button class="filter" data-f="matte">Matte</button>
<button class="filter" data-f="dramatic">Dramatic</button>
<button class="filter" data-f="night">Night</button>
<button class="filter" data-f="soft">Soft</button>
<button class="filter" data-f="retro">Retro</button>
</div>
<div class="mini">Filter lassen sich mit allen Reglern kombinieren.</div>
</div>

<div class="panel" id="crop" hidden>
<div class="grid3">
<button class="btn" data-r="0">Frei</button>
<button class="btn" data-r="1">1:1</button>
<button class="btn" data-r="0.8">4:5</button>
<button class="btn" data-r="1.5">3:2</button>
<button class="btn" data-r="1.7777778">16:9</button>
<button class="btn" data-r="0.5625">9:16</button>
</div>
<div class="grid2" style="margin-top:7px"><button class="btn" id="rot">↻ Drehen</button><button class="btn" id="flipH">↔ Spiegeln</button></div>
<div class="mini">Der Zuschnitt bleibt aktuell zentriert. Freies Verschieben kommt in 0.3.</div>
</div>

<div class="panel" id="export" hidden>
<div class="grid2">
<select id="format" class="quality"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select>
<select id="quality" class="quality"><option value="0.75">Qualität 75%</option><option value="0.9" selected>Qualität 90%</option><option value="0.97">Qualität 97%</option></select>
</div>
<div class="bottom"><button class="btn" id="reset" disabled>Zurücksetzen</button><button class="btn primary" id="save" disabled>Exportieren</button></div>
<div class="mini">Bei PNG wird die Qualitätswahl ignoriert.</div>
</div>
</div>

<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
let img=null,orig=null,angle=0,flip=false,cropRatio=0,filter='none',history=[],future=[],renderTimer=0;
const vals={exposure:0,brightness:0,contrast:0,highlights:0,shadows:0,whites:0,blacks:0,saturate:0,vibrance:0,warmth:0,tint:0,fade:0,clarity:0,sharpness:0,grain:0,vignette:0};
const state=()=>({vals:{...vals},angle,flip,cropRatio,filter});
function restore(s){Object.assign(vals,s.vals);angle=s.angle;flip=s.flip;cropRatio=s.cropRatio;filter=s.filter;$$('input[type=range]').forEach(r=>{r.value=vals[r.dataset.k];r.parentElement.querySelector('output').textContent=r.value});$$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.f===filter));render();updateHist()}
function snap(){history.push(JSON.stringify(state()));if(history.length>40)history.shift();future=[];updateHist()}
function updateHist(){$('#undo').disabled=history.length<2;$('#redo').disabled=future.length===0}
function cl(v){return Math.max(0,Math.min(255,v))}
function openFile(f){if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;const max=1800,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));cv.width=Math.round(im.naturalWidth*sc);cv.height=Math.round(im.naturalHeight*sc);ctx.drawImage(im,0,0,cv.width,cv.height);orig=ctx.getImageData(0,0,cv.width,cv.height);Object.keys(vals).forEach(k=>vals[k]=0);angle=0;flip=false;cropRatio=0;filter='none';$('#empty').hidden=true;cv.hidden=false;$('#save').disabled=$('#reset').disabled=false;history=[JSON.stringify(state())];future=[];render();updateHist();URL.revokeObjectURL(u)};im.src=u}
$('#open').onclick=()=>$('#file').click();$('#file').onchange=e=>openFile(e.target.files[0]);
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['light','color','detail','filter','crop','export'].forEach(id=>$('#'+id).hidden=id!==b.dataset.tab)});
$$('input[type=range]').forEach(r=>{r.oninput=()=>{vals[r.dataset.k]=+r.value;r.parentElement.querySelector('output').textContent=r.value;clearTimeout(renderTimer);renderTimer=setTimeout(render,10)};r.onchange=()=>{if(img)snap()}});
$$('.filter').forEach(b=>b.onclick=()=>{if(!img)return;filter=b.dataset.f;$$('.filter').forEach(x=>x.classList.toggle('active',x===b));render();snap()});
$$('[data-r]').forEach(b=>b.onclick=()=>{if(!img)return;cropRatio=+b.dataset.r;render();snap()});
$('#rot').onclick=()=>{if(!img)return;angle=(angle+90)%360;render();snap()};$('#flipH').onclick=()=>{if(!img)return;flip=!flip;render();snap()};
$('#undo').onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(JSON.parse(history[history.length-1]))};$('#redo').onclick=()=>{if(!future.length)return;let s=future.pop();history.push(s);restore(JSON.parse(s))};
$('#reset').onclick=()=>{if(!img)return;Object.keys(vals).forEach(k=>vals[k]=0);angle=0;flip=false;cropRatio=0;filter='none';render();snap();$$('input[type=range]').forEach(r=>{r.value=0;r.parentElement.querySelector('output').textContent='0'});$$('.filter').forEach(b=>b.classList.toggle('active',b.dataset.f==='none'))};
function preset(){return {none:'',vivid:'contrast(110%) saturate(122%)',portrait:'brightness(103%) contrast(96%) saturate(106%)',warm:'sepia(10%) saturate(112%)',cool:'hue-rotate(8deg) saturate(104%)',mono:'grayscale(100%) contrast(110%)',film:'sepia(16%) contrast(106%) saturate(88%)',matte:'contrast(88%) saturate(82%) brightness(106%)',dramatic:'contrast(132%) saturate(85%)',night:'brightness(88%) contrast(118%) saturate(92%) hue-rotate(4deg)',soft:'brightness(105%) contrast(90%) saturate(95%)',retro:'sepia(26%) contrast(104%) saturate(76%)'}[filter]||''}
function render(){if(!img||!orig)return;const base=document.createElement('canvas'),b=base.getContext('2d');base.width=orig.width;base.height=orig.height;b.putImageData(orig,0,0);const rot=angle%180!==0,out=document.createElement('canvas'),o=out.getContext('2d',{willReadFrequently:true});out.width=rot?base.height:base.width;out.height=rot?base.width:base.height;o.save();o.translate(out.width/2,out.height/2);o.rotate(angle*Math.PI/180);o.scale(flip?-1:1,1);let br=100+vals.brightness*.55+vals.exposure*.8,co=100+vals.contrast*.75+vals.clarity*.22,sa=100+vals.saturate+vals.vibrance*.45;o.filter=`brightness(${br}%) contrast(${co}%) saturate(${sa}%) ${preset()}`;o.drawImage(base,-base.width/2,-base.height/2);o.restore();
let id=o.getImageData(0,0,out.width,out.height),d=id.data;const W=vals.warmth,T=vals.tint,H=vals.highlights,S=vals.shadows,Wh=vals.whites,Bk=vals.blacks,F=vals.fade,V=vals.vibrance;
for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],bb=d[i+2],lum=(r+g+bb)/3;if(W){r+=W*.23;bb-=W*.23}if(T){r+=T*.08;bb+=T*.08;g-=T*.12}if(H&&lum>145){let q=((lum-145)/110)*H*.32;r+=q;g+=q;bb+=q}if(S&&lum<125){let q=(1-lum/125)*S*.34;r+=q;g+=q;bb+=q}if(Wh&&lum>180){let q=((lum-180)/75)*Wh*.36;r+=q;g+=q;bb+=q}if(Bk&&lum<80){let q=(1-lum/80)*Bk*.36;r+=q;g+=q;bb+=q}if(V){let max=Math.max(r,g,bb),min=Math.min(r,g,bb),sat=max-min,f=(1-Math.min(1,sat/128))*V*.003;r=lum+(r-lum)*(1+f);g=lum+(g-lum)*(1+f);bb=lum+(bb-lum)*(1+f)}if(F){let m=F*.45;r=r+(128-r)*m/100;g=g+(128-g)*m/100;bb=bb+(128-bb)*m/100}d[i]=cl(r);d[i+1]=cl(g);d[i+2]=cl(bb)}o.putImageData(id,0,0);
if(vals.grain){let id2=o.getImageData(0,0,out.width,out.height),q=id2.data,amt=vals.grain*.42;for(let i=0;i<q.length;i+=4){let n=(Math.random()-.5)*amt;q[i]=cl(q[i]+n);q[i+1]=cl(q[i+1]+n);q[i+2]=cl(q[i+2]+n)}o.putImageData(id2,0,0)}
if(vals.vignette){let g=o.createRadialGradient(out.width/2,out.height/2,Math.min(out.width,out.height)*.2,out.width/2,out.height/2,Math.max(out.width,out.height)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vals.vignette/135})`);o.fillStyle=g;o.fillRect(0,0,out.width,out.height)}
let sx=0,sy=0,sw=out.width,sh=out.height;if(cropRatio>0){let cur=sw/sh;if(cur>cropRatio){sw=sh*cropRatio;sx=(out.width-sw)/2}else{sh=sw/cropRatio;sy=(out.height-sh)/2}}
cv.width=Math.max(1,Math.round(sw));cv.height=Math.max(1,Math.round(sh));ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(out,sx,sy,sw,sh,0,0,cv.width,cv.height)}
let held=false;cv.addEventListener('pointerdown',()=>{if(!orig)return;held=true;let t=document.createElement('canvas'),x=t.getContext('2d');t.width=orig.width;t.height=orig.height;x.putImageData(orig,0,0);cv.width=t.width;cv.height=t.height;ctx.drawImage(t,0,0)});window.addEventListener('pointerup',()=>{if(held){held=false;render()}});
$('#save').onclick=()=>{if(!img)return;const type=$('#format').value,q=+$('#quality').value;cv.toBlob(blob=>{if(!blob)return;let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LumaEdit_'+Date.now()+(type==='image/png'?'.png':'.jpg');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},type,type==='image/png'?undefined:q)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
