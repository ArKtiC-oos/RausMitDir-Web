<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Raus mit Dir!"><link rel="manifest" href="manifest.webmanifest">
<title>Raus mit Dir!</title>
<style>
:root{--bg:#09111f;--card:#121d31;--line:#2b3956;--text:#f7f9ff;--muted:#9eabc3;--a:#7668ff;--r:#ff5e73;--b:#4da3ff;--g:#4ed79b;--y:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18284a,#09111f 42%,#060b14);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:max(18px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));min-height:100vh}.app{max-width:680px;margin:auto}.head{display:flex;gap:12px;align-items:center;margin:4px 4px 16px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#8b7dff,#5d54d8);display:grid;place-items:center;font-size:26px;font-weight:900}.head h1{margin:0;font-size:24px}.head p{margin:3px 0 0;color:var(--muted);font-size:13px}.card{background:linear-gradient(180deg,#152139,#0e1728);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:16px;margin-bottom:14px}.hidden{display:none!important}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#b2bed1}.title{font-size:20px;font-weight:800;margin:5px 0}.sub{font-size:13px;color:var(--muted);line-height:1.4}.input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:#0b1526;color:white;padding:0 14px;font-size:16px;margin-top:8px}.row{display:flex;gap:10px;margin-top:12px}.btn{flex:1;height:50px;border:0;border-radius:14px;color:white;background:linear-gradient(135deg,#8375ff,#5e56db);font-weight:800;font-size:15px}.btn.alt{background:#1b2942;border:1px solid #31425f}.btn:disabled{opacity:.4}.sep{height:1px;background:var(--line);margin:16px 0}.code{font-size:30px;font-weight:900;letter-spacing:.18em;margin:7px 0}.players{display:grid;gap:8px;margin:14px 0}.pl{padding:10px 12px;border-radius:14px;background:#101a2c;border:1px solid #293751;display:flex;gap:10px;align-items:center}.dot{width:12px;height:12px;border-radius:50%}.name{flex:1;font-weight:700}.status{font-size:12px;color:var(--muted)}.boardWrap{padding:8px;background:#0b1424;border:1px solid #22314a;border-radius:22px}.board{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:2px;position:relative}.c{position:relative;border-radius:50%;background:#e7edf7;border:1px solid #cbd4e4}.void{background:transparent;border:0}.home{opacity:.9}.piece{position:absolute;inset:10%;border-radius:50%;border:2px solid white;z-index:3;box-shadow:0 4px 10px #0008;display:grid;place-items:center;font-size:10px;font-weight:900;color:#06101f}.legal{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.18);filter:brightness(1.18)}}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.dice{height:72px;border:0;border-radius:17px;font-size:38px;background:#fff;color:#111a2b;font-weight:900}.hint{border-radius:17px;background:#111c30;border:1px solid #293851;padding:11px;display:flex;flex-direction:column;justify-content:center}.hint span{color:var(--muted);font-size:12px;margin-top:4px}.win{text-align:center}.win .cup{font-size:56px}.toast{display:none;position:sticky;bottom:10px;background:#f7f9ff;color:#111827;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body><div class="app">
<div class="head"><div class="logo">↗</div><div><h1>Raus mit Dir!</h1><p>Online · 2–4 Spieler</p></div></div>
<section id="home" class="card"><div class="ey">Prototype 0.1</div><div class="title">Neue Runde</div><div class="sub">Raum erstellen oder per 6-stelligem Code beitreten.</div>
<input id="name" class="input" maxlength="16" placeholder="Dein Name">
<div class="row"><button id="create" class="btn">Raum erstellen</button><button id="toggle" class="btn alt">Beitreten</button></div>
<div id="joinbox" class="hidden"><div class="sep"></div><input id="codein" class="input" maxlength="6" inputmode="numeric" placeholder="Raumcode"><button id="join" class="btn" style="width:100%;margin-top:10px">Beitreten</button></div>
</section>
<section id="lobby" class="card hidden"><div class="status" id="conn">Verbinde…</div><div class="ey" style="margin-top:12px">Raumcode</div><div id="roomcode" class="code">------</div><div class="sub">Code an Mitspieler schicken.</div><div id="players" class="players"></div><button id="start" class="btn" style="width:100%" disabled>Spiel starten</button><button id="leave1" class="btn alt" style="width:100%;margin-top:9px">Verlassen</button></section>
<section id="game" class="hidden"><div class="card"><div class="title" id="turn">–</div><div class="sub" id="turnsub">–</div><div class="boardWrap" style="margin-top:12px"><div id="board" class="board"></div></div><div class="controls"><button id="dice" class="dice" disabled>🎲</button><div class="hint"><b id="hint1">Warten</b><span id="hint2">–</span></div></div><button id="leave2" class="btn alt" style="width:100%;margin-top:10px">Spiel verlassen</button></div></section>
<section id="winner" class="card hidden win"><div class="cup">🏆</div><div class="ey">Spiel beendet</div><div id="winnername" class="title">Gewonnen!</div><button id="homebtn" class="btn" style="width:100%">Zur Startseite</button></section>
<div id="toast" class="toast"></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),COL=['r','b','g','y'],CSS={r:'var(--r)',b:'var(--b)',g:'var(--g)',y:'var(--y)'};
let peer=null,isHost=false,myId='',myPid='',hostConn=null,conns=[],state=null;
const track=[[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[5,0],[6,0],[6,1],[6,2],[6,3],[6,4],[7,4],[8,4],[9,4],[10,4],[10,5],[10,6],[9,6],[8,6],[7,6],[6,6],[6,7],[6,8],[6,9],[6,10],[5,10],[4,10],[4,9],[4,8],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5]],starts=[0,10,20,30];
const homes=[[[1,5],[2,5],[3,5],[4,5]],[[5,9],[5,8],[5,7],[5,6]],[[9,5],[8,5],[7,5],[6,5]],[[5,1],[5,2],[5,3],[5,4]]];
const bases=[[[0,0],[0,1],[1,0],[1,1]],[[0,9],[0,10],[1,9],[1,10]],[[9,9],[9,10],[10,9],[10,10]],[[9,0],[9,1],[10,0],[10,1]]];
function sc(id){['home','lobby','game','winner'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2400)}
function clean(v){return (v||'Spieler').trim().replace(/[<>]/g,'').slice(0,16)||'Spieler'}
function code(){let a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000)}
function die(){let a=new Uint32Array(1);crypto.getRandomValues(a);return 1+a[0]%6}
function init(id,cb){if(typeof Peer==='undefined')return toast('Online-Dienst nicht erreichbar.');peer=id?new Peer(id):new Peer();peer.on('open',x=>{myId=x;cb(x)});peer.on('error',e=>toast('Verbindung: '+e.type))}
$('#toggle').onclick=()=>$('#joinbox').classList.toggle('hidden');
$('#create').onclick=()=>{const c=code();isHost=true;sc('lobby');$('#roomcode').textContent=c;init('rmd-'+c,()=>{myPid='p0';state={room:c,players:[{id:'p0',name:clean($('#name').value),color:0}],pieces:[[0,-1,-1,-1]],turn:0,phase:'lobby',d:null,legal:[],winner:null};$('#conn').textContent='Verbunden · Host';renderLobby();peer.on('connection',co=>{co.on('data',m=>hostMsg(co,m))})})};
$('#join').onclick=()=>{let c=$('#codein').value.replace(/\D/g,'').slice(0,6);if(c.length!==6)return toast('6-stelligen Code eingeben.');isHost=false;sc('lobby');$('#roomcode').textContent=c;init(null,()=>{hostConn=peer.connect('rmd-'+c,{reliable:true});hostConn.on('open',()=>{hostConn.send({type:'join',name:clean($('#name').value)})});hostConn.on('data',m=>{if(m.type==='welcome'){myPid=m.pid;state=m.state;$('#conn').textContent='Verbunden';render()}else if(m.type==='state'){state=m.state;render()}else if(m.type==='reject'){toast(m.reason)}})})};
function hostMsg(co,m){if(m.type==='join'){if(!state||state.phase!=='lobby'||state.players.length>=4){co.send({type:'reject',reason:'Raum voll oder Spiel läuft.'});return}let pid='p'+Date.now().toString(36);co.pid=pid;state.players.push({id:pid,name:clean(m.name),color:state.players.length});state.pieces.push([0,-1,-1,-1]);conns.push(co);co.send({type:'welcome',pid,state});broadcast()}else if(m.type==='action')act(co.pid,m.a)}
function broadcast(){if(!isHost)return;conns=conns.filter(c=>c.open);conns.forEach(c=>c.send({type:'state',state}));render()}
function send(a){if(isHost)act(myPid,a);else if(hostConn&&hostConn.open)hostConn.send({type:'action',a})}
function renderLobby(){let p=$('#players');p.innerHTML='';state.players.forEach((x,i)=>{let d=document.createElement('div');d.className='pl';d.innerHTML='<span class="dot"></span><span class="name"></span><span class="status">'+(i===0?'HOST':'')+'</span>';d.querySelector('.dot').style.background=CSS[COL[x.color]];d.querySelector('.name').textContent=x.name;p.appendChild(d)});$('#start').disabled=!(isHost&&state.players.length>=2)}
$('#start').onclick=()=>send({type:'start'});$('#dice').onclick=()=>send({type:'roll'});
function act(pid,a){if(!isHost||!state)return;let pi=state.players.findIndex(p=>p.id===pid);if(pi<0)return;if(a.type==='start'&&pi===0&&state.players.length>=2){state.turn=Math.floor(Math.random()*state.players.length);state.phase='roll';broadcast();return}if(pi!==state.turn||state.winner!=null)return;if(a.type==='roll'&&state.phase==='roll'){state.d=die();state.legal=legal(pi,state.d);if(!state.legal.length){state.phase='wait';broadcast();setTimeout(()=>{next();broadcast()},650)}else{state.phase='move';broadcast()}}else if(a.type==='move'&&state.phase==='move'&&state.legal.includes(a.k)){move(pi,a.k,state.d)}}
function legal(pi,d){let a=state.pieces[pi],base=a.map((x,i)=>x<0?i:-1).filter(i=>i>=0),out=[];if(d===6&&base.length){if(a.includes(0)){let k=a.indexOf(0);if(a[k]+6<=43&&!a.includes(a[k]+6))return[k]}return base}for(let i=0;i<4;i++){if(a[i]>=0&&a[i]+d<=43&&!a.some((v,j)=>j!==i&&v===a[i]+d))out.push(i)}return out}
function move(pi,k,d){let p=state.pieces[pi][k];state.pieces[pi][k]=(p<0&&d===6)?0:p+d;let np=state.pieces[pi][k];if(np<40){let abs=(starts[pi]+np)%40;for(let oi=0;oi<state.players.length;oi++)if(oi!==pi)for(let ok=0;ok<4;ok++){let op=state.pieces[oi][ok];if(op>=0&&op<40&&(starts[oi]+op)%40===abs)state.pieces[oi][ok]=-1}}if(state.pieces[pi].every(x=>x>=40)){state.winner=pi;state.phase='done';broadcast();return}let extra=d===6;state.d=null;state.legal=[];if(extra){state.phase='roll';broadcast()}else{state.phase='wait';broadcast();setTimeout(()=>{next();broadcast()},450)}}
function next(){state.turn=(state.turn+1)%state.players.length;state.phase='roll';state.d=null;state.legal=[]}
function render(){if(!state)return;if(state.phase==='lobby'){sc('lobby');renderLobby();return}if(state.winner!=null){sc('winner');$('#winnername').textContent=state.players[state.winner].name+' gewinnt!';return}sc('game');let me=state.players.findIndex(p=>p.id===myPid),mine=me===state.turn;$('#turn').textContent=mine?'Du bist dran':'Am Zug: '+state.players[state.turn].name;$('#turnsub').textContent='Farbe '+(state.players[state.turn].color+1)+(state.d?' · Würfel '+state.d:'');$('#dice').textContent=state.d?['','⚀','⚁','⚂','⚃','⚄','⚅'][state.d]:'🎲';$('#dice').disabled=!(mine&&state.phase==='roll');$('#hint1').textContent=mine&&state.phase==='move'?'Figur wählen':mine?'Würfeln':'Warten';$('#hint2').textContent=mine&&state.phase==='move'?'Leuchtende Figur antippen.':mine?'Tippe auf den Würfel.':'Mitspieler ist am Zug.';draw(me)}
function draw(me){let b=$('#board');b.innerHTML='';for(let r=0;r<11;r++)for(let c=0;c<11;c++){let d=document.createElement('div');d.dataset.r=r;d.dataset.c=c;d.className='void';d.style.gridRow=r+1;d.style.gridColumn=c+1;b.appendChild(d)}let cell=(r,c)=>b.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');track.forEach(q=>cell(q[0],q[1]).className='c');homes.forEach((h,pi)=>h.forEach(q=>{let d=cell(q[0],q[1]);d.className='c home';d.style.background=CSS[COL[pi]]}));bases.forEach((bs,pi)=>bs.forEach(q=>{let d=cell(q[0],q[1]);d.className='c home';d.style.background=CSS[COL[pi]]}));state.players.forEach((pl,pi)=>state.pieces[pi].forEach((pos,k)=>{let q;if(pos<0){let n=state.pieces[pi].slice(0,k).filter(x=>x<0).length;q=bases[pi][n]}else if(pos<40)q=track[(starts[pi]+pos)%40];else q=homes[pi][pos-40];let pc=document.createElement('div');pc.className='piece';pc.style.background=CSS[COL[pi]];pc.textContent=k+1;if(pi===me&&state.turn===me&&state.phase==='move'&&state.legal.includes(k)){pc.classList.add('legal');pc.onclick=()=>send({type:'move',k})}cell(q[0],q[1]).appendChild(pc)}))}
function reset(){try{conns.forEach(c=>c.close());hostConn&&hostConn.close();peer&&peer.destroy()}catch(e){}peer=null;hostConn=null;conns=[];state=null;isHost=false;myPid='';sc('home')}
$('#leave1').onclick=reset;$('#leave2').onclick=reset;$('#homebtn').onclick=reset;sc('home')})();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
